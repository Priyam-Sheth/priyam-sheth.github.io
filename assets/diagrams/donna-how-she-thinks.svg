<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dgD-t" font-family="'Fragment Mono','Courier New',monospace" class="diagram">
  <title id="dgD-t">How Donna thinks: you message her, she checks her memory and her rules, her helpers do the work, and her reviewer approves it before your phone buzzes.</title>
  <style>
    .node      { fill:#FAF8F3; stroke:#141310; stroke-width:1.5; }
    .t-title   { font-size:15px; font-weight:700; fill:#141310; letter-spacing:0.4px; }
    .t-sub     { font-size:11.5px; fill:#6B6560; letter-spacing:0.3px; }
    .t-tag     { font-size:11px; fill:#6B6560; letter-spacing:0.5px; }
    .t-tag-red { font-size:11px; fill:#C8430A; letter-spacing:0.5px; font-weight:700; }
    .flow      { fill:none; stroke:#141310; stroke-width:1.5; stroke-dasharray:5 5; }
    .flow-red  { fill:none; stroke:#C8430A; stroke-width:2; }
  </style>
  <defs>
    <marker id="dgD-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#141310" stroke-width="1.4"/>
    </marker>
    <marker id="dgD-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#C8430A" stroke-width="1.4"/>
    </marker>
  </defs>

  <g data-draw="1">
    <rect class="node" x="40" y="60" width="190" height="72"/>
    <text class="t-title" x="56" y="90">you</text>
    <text class="t-sub" x="56" y="112">on your phone</text>
  </g>
  <g data-draw="2"><path class="flow" d="M230,96 H290" marker-end="url(#dgD-a)"/></g>
  <g data-draw="3">
    <rect class="node" x="290" y="60" width="200" height="72"/>
    <text class="t-title" x="306" y="90">her memory</text>
    <text class="t-sub" x="306" y="112">everything you've told her</text>
  </g>
  <g data-draw="4"><path class="flow" d="M490,96 H550" marker-end="url(#dgD-a)"/></g>
  <g data-draw="5">
    <rect class="node" x="550" y="60" width="180" height="72"/>
    <text class="t-title" x="566" y="90">her rules</text>
    <text class="t-sub" x="566" y="112">what she won't do</text>
  </g>
  <g data-draw="6"><path class="flow" d="M730,96 H790" marker-end="url(#dgD-a)"/></g>
  <g data-draw="7">
    <rect class="node" x="790" y="60" width="180" height="72"/>
    <text class="t-title" x="806" y="90">her helpers</text>
    <text class="t-sub" x="806" y="112">builders + a reviewer</text>
  </g>

  <!-- the payoff loop, in red — drawn LAST -->
  <g data-draw="8">
    <path class="flow-red" d="M135,132 V220 H880 V132" marker-end="url(#dgD-ar)"/>
  </g>
  <g data-draw="9">
    <text class="t-tag-red" x="150" y="250">you say two words</text>
    <text class="t-tag" x="150" y="270">→ a builder builds</text>
    <text class="t-tag" x="360" y="270">→ the reviewer checks the work + runs the tests</text>
    <text class="t-tag-red" x="760" y="270">→ your phone buzzes</text>
  </g>
  <g data-draw="10">
    <text class="t-tag" x="150" y="330">her own reviewer signs off before she ever shows you anything.</text>
  </g>
</svg>
