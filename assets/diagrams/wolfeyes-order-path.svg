<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dgW-t" font-family="'Fragment Mono','Courier New',monospace" class="diagram">
  <title id="dgW-t">Where an order goes: a dealer taps order, the right approver sees it, and it lands in the company's real books as a draft. Prices are scrambled before they ever leave the server.</title>
  <style>
    .node      { fill:#FAF8F3; stroke:#141310; stroke-width:1.5; }
    .t-title   { font-size:15px; font-weight:700; fill:#141310; letter-spacing:0.4px; }
    .t-sub     { font-size:11.5px; fill:#6B6560; letter-spacing:0.3px; }
    .t-tag     { font-size:11px; fill:#6B6560; letter-spacing:0.5px; }
    .t-tag-red { font-size:11px; fill:#C8430A; letter-spacing:0.5px; font-weight:700; }
    .flow      { fill:none; stroke:#141310; stroke-width:1.5; stroke-dasharray:5 5; }
    .flow-red  { fill:none; stroke:#C8430A; stroke-width:2; }
    .rupee     { font-size:16px; font-weight:700; fill:#C8430A; }
  </style>
  <defs>
    <marker id="dgW-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#C8430A" stroke-width="1.4"/>
    </marker>
  </defs>

  <g data-draw="1">
    <rect class="node" x="40" y="70" width="230" height="80"/>
    <text class="t-title" x="56" y="100">a dealer taps order</text>
    <text class="t-sub" x="56" y="122">seeing only their prices</text>
  </g>
  <g data-draw="2">
    <text class="t-tag" x="290" y="60">prices are scrambled before</text>
    <text class="t-tag" x="290" y="76">they ever leave the server</text>
  </g>
  <g data-draw="3">
    <rect class="node" x="385" y="70" width="250" height="80"/>
    <text class="t-title" x="401" y="100">the right approver</text>
    <text class="t-sub" x="401" y="122">their distributor — or auto,</text>
    <text class="t-sub" x="401" y="138">when the rules allow it</text>
  </g>
  <g data-draw="4">
    <rect class="node" x="750" y="70" width="220" height="80"/>
    <text class="t-title" x="766" y="100">the real books</text>
    <text class="t-sub" x="766" y="122">lands as a draft —</text>
    <text class="t-sub" x="766" y="138">a human posts it</text>
  </g>

  <!-- the red money path — drawn last, a ₹ travels it in the film -->
  <g data-draw="5">
    <path class="flow-red" id="dgW-money" d="M270,110 H385 M635,110 H750" marker-end="url(#dgW-ar)"/>
    <text class="rupee" data-money-mark="1" x="262" y="98">₹</text>
  </g>
  <g data-draw="6">
    <text class="t-tag-red" x="40" y="210">no re-typing. no lost orders. no “I'll add it to the books later.”</text>
    <text class="t-tag" x="40" y="236">every change to anything money-related gets reviewed by a second AI before it ships. house rule.</text>
  </g>
</svg>
