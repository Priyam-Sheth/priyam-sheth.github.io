<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="we2Title we2Desc" font-family="'Fragment Mono','Courier New',monospace">
  <title id="we2Title">Wolf Eyes B2B — System Schematic</title>
  <desc id="we2Desc">Engineering schematic of the Wolf Eyes B2B platform: multi-level account hierarchy with tier pricing and server-side redaction, channel-based order routing with approval chains, the hardened platform layer, and Zoho Books as source of truth receiving draft sales orders.</desc>

  <style>
    .sheet     { fill:#F4F1EA; }
    .node      { fill:#FAF8F3; stroke:#141310; stroke-width:1.5; }
    .node-hero { fill:#FAF8F3; stroke:#141310; stroke-width:2; }
    .band-rule { stroke:#DDD8CE; stroke-width:1; }
    .frame     { fill:none; stroke:#141310; stroke-width:1.5; }
    .tick      { stroke:#141310; stroke-width:1.5; }
    .t-title   { font-size:13px; font-weight:700; fill:#141310; letter-spacing:0.4px; }
    .t-sub     { font-size:10.5px; fill:#6B6560; letter-spacing:0.3px; }
    .t-band    { font-size:10px; fill:#6B6560; letter-spacing:2.2px; }
    .t-tag     { font-size:10px; fill:#6B6560; letter-spacing:0.5px; }
    .t-tag-red { font-size:10px; fill:#C8430A; letter-spacing:0.5px; }
    .t-block   { font-size:10px; fill:#141310; letter-spacing:0.6px; }
    .t-block-h { font-size:10.5px; font-weight:700; fill:#141310; letter-spacing:0.4px; }
    .flow      { fill:none; stroke:#141310; stroke-width:1.25; stroke-dasharray:5 5; }
    .flow-red  { fill:none; stroke:#C8430A; stroke-width:1.5;  stroke-dasharray:7 5; }
    .anim .flow     { animation: march 1.6s linear infinite; }
    .anim .flow-red { animation: march 2.2s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -10; } }
    @media (prefers-reduced-motion: reduce) {
      .anim .flow, .anim .flow-red { animation: none; }
    }
  </style>

  <defs>
    <marker id="arr2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#141310" stroke-width="1.4"/>
    </marker>
    <marker id="arrRed2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#C8430A" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect class="sheet" x="0" y="0" width="1200" height="800"/>
  <rect class="frame" x="24" y="24" width="1152" height="752"/>
  <path class="tick" d="M24,44 V24 H44 M1156,24 H1176 V44 M1176,756 V776 H1156 M44,776 H24 V756" fill="none"/>

  <g class="anim">

  <!-- band labels + rules -->
  <text class="t-band" x="60" y="62">01 · ACCOUNT HIERARCHY</text>
  <line class="band-rule" x1="256" y1="58" x2="1140" y2="58"/>
  <text class="t-band" x="60" y="222">02 · ORDER ROUTING</text>
  <line class="band-rule" x1="224" y1="218" x2="1140" y2="218"/>
  <text class="t-band" x="60" y="402">03 · PLATFORM</text>
  <line class="band-rule" x1="182" y1="398" x2="1140" y2="398"/>
  <text class="t-band" x="60" y="582">04 · SOURCE OF TRUTH</text>
  <line class="band-rule" x1="240" y1="578" x2="1140" y2="578"/>

  <!-- ============ 01 ACCOUNT HIERARCHY ============ -->
  <rect class="node" x="140" y="88" width="180" height="60"/>
  <text class="t-title" x="152" y="110">DISTRIBUTOR</text>
  <text class="t-sub"   x="152" y="126">approves channel orders</text>

  <rect class="node" x="400" y="88" width="160" height="60"/>
  <text class="t-title" x="412" y="110">REP</text>
  <text class="t-sub"   x="412" y="126">field ordering</text>

  <rect class="node" x="640" y="88" width="160" height="60"/>
  <text class="t-title" x="652" y="110">DEALER</text>
  <text class="t-sub"   x="652" y="126">self-service orders</text>

  <rect class="node" x="880" y="88" width="230" height="60"/>
  <text class="t-title" x="892" y="110">PRICE TIER ENGINE</text>
  <text class="t-sub"   x="892" y="126">server-side redaction —</text>
  <text class="t-sub"   x="892" y="140">tiers never leak downstream</text>

  <path class="flow" d="M320,118 H400" marker-end="url(#arr2)"/>
  <path class="flow" d="M560,118 H640" marker-end="url(#arr2)"/>
  <path class="flow" d="M880,118 H800" marker-end="url(#arr2)"/>

  <!-- ============ 02 ORDER ROUTING ============ -->
  <rect class="node" x="140" y="250" width="190" height="60"/>
  <text class="t-title" x="152" y="272">DEALER ORDER</text>
  <text class="t-sub"   x="152" y="288">placed on b2bwolfeyes.in</text>

  <rect class="node-hero" x="410" y="250" width="200" height="60"/>
  <text class="t-title" x="422" y="272">CHANNEL ROUTER</text>
  <text class="t-sub"   x="422" y="288">per-channel approval rules</text>

  <rect class="node" x="700" y="232" width="220" height="50"/>
  <text class="t-title" x="712" y="252">DISTRIBUTOR APPROVAL</text>
  <text class="t-sub"   x="712" y="268">routed for review</text>

  <rect class="node" x="700" y="300" width="220" height="50"/>
  <text class="t-title" x="712" y="320">AUTO-PUSH</text>
  <text class="t-sub"   x="712" y="336">direct by channel rule</text>

  <text class="t-tag" x="960" y="258">EVERY MONEY-PATH CHANGE</text>
  <text class="t-tag" x="960" y="274">PASSES AN ADVERSARIAL</text>
  <text class="t-tag" x="960" y="290">VERIFIER BEFORE MERGE</text>

  <path class="flow-red" d="M330,280 H410" marker-end="url(#arrRed2)"/>
  <path class="flow-red" d="M610,266 H700" marker-end="url(#arrRed2)"/>
  <path class="flow-red" d="M610,294 H660 V325 H700" marker-end="url(#arrRed2)"/>

  <!-- ============ 03 PLATFORM ============ -->
  <rect class="node-hero" x="140" y="420" width="300" height="100"/>
  <line class="band-rule" x1="140" y1="452" x2="440" y2="452"/>
  <text class="t-title" x="152" y="442">NEXT.JS 15 + FASTIFY 5</text>
  <text class="t-sub"   x="152" y="474">prisma 6 · postgresql 16</text>
  <text class="t-sub"   x="152" y="490">cloudflare R2 · vps + caddy</text>
  <text class="t-sub"   x="152" y="506">order-slip PDF — ₹ embedded font</text>

  <rect class="node" x="480" y="420" width="250" height="100"/>
  <line class="band-rule" x1="480" y1="452" x2="730" y2="452"/>
  <text class="t-title" x="492" y="442">SECURITY HARDENING</text>
  <text class="t-sub"   x="492" y="474">fail-closed rate limiting</text>
  <text class="t-sub"   x="492" y="490">locked CORS · headers + CSP</text>
  <text class="t-sub"   x="492" y="506">show-once credentials</text>

  <rect class="node" x="770" y="420" width="270" height="100"/>
  <line class="band-rule" x1="770" y1="452" x2="1040" y2="452"/>
  <text class="t-title" x="782" y="442">TELEGRAM ALERTING</text>
  <text class="t-sub"   x="782" y="474">login spikes · OTP failures</text>
  <text class="t-sub"   x="782" y="490">zoho token death · stuck orders</text>
  <text class="t-sub"   x="782" y="506">in-app + systemd-timer split</text>

  <!-- ============ 04 SOURCE OF TRUTH ============ -->
  <rect class="node-hero" x="140" y="600" width="280" height="70"/>
  <text class="t-title" x="152" y="622">ZOHO BOOKS</text>
  <text class="t-sub"   x="152" y="638">source of truth — client's real books</text>
  <text class="t-sub"   x="152" y="652">orders land as DRAFT sales orders</text>

  <rect class="node" x="480" y="600" width="260" height="70"/>
  <text class="t-title" x="492" y="622">CATALOGUE SYNC</text>
  <text class="t-sub"   x="492" y="638">~1,600 items from zoho</text>
  <text class="t-sub"   x="492" y="652">3-layer mass-hide safety valve</text>

  <rect class="node" x="800" y="600" width="240" height="70"/>
  <text class="t-title" x="812" y="622">ADMIN ORDER EDITING</text>
  <text class="t-sub"   x="812" y="638">full edit · audit snapshots</text>
  <text class="t-sub"   x="812" y="652">failed-login audit trail</text>

  <!-- ink flows -->
  <path class="flow" d="M960,148 V180 H720 V148" marker-end="url(#arr2)"/>
  <path class="flow" d="M610,600 V560 H290 V520" marker-start="url(#arr2)" marker-end="url(#arr2)"/>

  <!-- red: approved order → zoho draft SO (routed via x750 corridor between nodes) -->
  <path class="flow-red" d="M810,282 V292 M810,350 V390 H750 V560 H280 V600" marker-end="url(#arrRed2)"/>
  <text class="t-tag-red" x="330" y="550">— ORDER PATH → DRAFT SO IN LIVE BOOKS</text>

  </g>

  <!-- ============ TITLE BLOCK — 2-col grid, budgeted cells ============ -->
  <rect class="frame" x="840" y="692" width="336" height="84" fill="#FAF8F3"/>
  <line class="band-rule" x1="840" y1="720" x2="1176" y2="720"/>
  <line class="band-rule" x1="840" y1="748" x2="1176" y2="748"/>
  <line class="band-rule" x1="1060" y1="692" x2="1060" y2="776"/>
  <text class="t-block-h" x="852" y="711" data-max-x="1052">WOLF EYES B2B — SCHEMATIC</text>
  <text class="t-block" x="1072" y="711" data-max-x="1168">FIG. 02</text>
  <text class="t-block" x="852" y="738" data-max-x="1052">LIVE · W1–W6 SHIPPED</text>
  <text class="t-block" x="1072" y="738" data-max-x="1168">SHEET 1/1</text>
  <text class="t-block" x="852" y="766" data-max-x="1052">CLIENT — WOLF EYES OPTICAL</text>
  <text class="t-block" x="1072" y="766" data-max-x="1168">SCALE — NONE</text>
</svg>
